spring.application.name=${DB_APP_NAME}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_HIBERNATE_DDL_AUTO}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.lab.nan_contextual.creation=true

spring.jackson.time-zone=America/Sao_Paulo
spring.datasource.hikari.data-source-properties.serverTimezone=America/Sao_Paulo

server.port=${SERVER_PORT}

api.security.token.secret=${JWT_SECRET}

allowed.ip1=${ALLOWED_IP1}
allowed.ip2=${ALLOWED_IP2}
ngrok.url=${NGROK_URL}
server.forward-headers-strategy=native
